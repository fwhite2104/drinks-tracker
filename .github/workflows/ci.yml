name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile Python modules
        run: python -m compileall -q beverage_feed
      - name: Run tests
        run: python -m pytest
      - name: Check CLI help
        run: python -m beverage_feed --help
      - name: Check static typing
        run: python -m mypy
